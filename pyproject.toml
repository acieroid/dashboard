[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-status"
version = "0.1.0"
description = "Push-based homelab status service and e-ink dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pillow>=10,<13",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
homelab-status = "homelab_status.main:main"
homelab-status-collector = "homelab_status.collector:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

